name = "reportli-website-scraper-v4"
main = "src/index.js"
compatibility_date = "2026-09-25"

[[queues.producers]]
binding = "SCRAPE_QUEUE"
queue = "reportli-scrape-pages"

[[queues.consumers]]
queue = "reportli-scrape-pages"
max_batch_size = 2
max_batch_timeout = 5
max_retries = 3
max_concurrency = 1
